<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="A private writing home for roleplayers.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8EFEF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>NUUVI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="/styles.css">
  <script src="/js/theme.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body class="guest">
  <div id="ambient" aria-hidden="true"><img alt=""></div>

    <main id="main" class="main" tabindex="-1"></main>
    <aside id="members" class="members-panel" aria-label="Members"></aside>

  <div id="toast" role="status" aria-live="polite"></div>
